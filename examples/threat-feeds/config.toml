# Example only. This directory is not a compiled default.

[basic]
# Intel entries are matched against the resolved client address; without a
# trusted-proxy list that address is the client-chosen X-Forwarded-For.
trusted_proxies = ["10.0.0.0/8"]   # your own proxies, not the world

[plugins.waf-strict]
category = "waf"
categories = { sql_injection = "block" }

[plugins.waf-strict.intel]
manual = ["198.51.100.7"]
staleness = "24h"

[[plugins.waf-strict.intel.feed]]
name = "example-blocklist"
url = "https://feeds.example.invalid/blocklist.txt"
category = "example"
enabled = false
