[package]
# The package keeps upstream's name `pingap`; the *binary* is `pingap-waf`, via
# the explicit `[[bin]]` below. Renaming the package is not available — the
# fork's own WAF crate at crates/pingap-waf already owns that name, and cargo
# refuses two packages with the same name in one workspace.
#
# clap's `#[command]` in src/main.rs omits `name`, so it takes the binary target
# name: `--help` and `--version` say `pingap-waf` with no source change. Nothing
# resolves the binary by a literal name at runtime — config validation spawns
# `std::env::current_exe()` and hot restart uses the recorded exec path — so the
# rename is transparent to both.
#
# Declaring `[[bin]]` turns off cargo's auto-discovery of src/main.rs, which the
# declaration replaces. Auto-discovery of src/bin/* is unaffected, so
# `cargo run --bin generate-mermaid` still works.
#
# Deliberately unchanged: the 19 `pingap-*` crate names, the `PINGAP_*`
# environment variables, and the runtime paths `/etc/pingap`, `/run/pingap.pid`
# and `/tmp/pingap_upgrade.sock`. Those are a contract with existing
# deployments, not build artifacts — and `pingap-controlplane` uses "pingap" as
# its token issuer while `pingap-cache` uses it as its on-disk namespace, so
# changing them would invalidate issued tokens and stored caches.
name = "pingap"
version.workspace = true
authors = ["Tree Xie <tree.xie@outlook.com>"]
edition = "2024"
categories = ["network-programming", "web-programming::http-server"]
keywords = ["proxy", "http", "gateway", "waf", "security"]
description = "A Pingora reverse proxy with a native WAF, domain ACL, JA4H bot management and a control plane"
license = "Apache-2.0"
homepage = "https://github.com/keepmeside/pingap-waf"
repository = "https://github.com/keepmeside/pingap-waf"
exclude = ["asset/*", "test/*", "Cargo.lock", "web/*", ".github/*", "docs/*"]
readme = "./README.md"
rust-version = "1.88"
default-run = "pingap-waf"
build = "build.rs"

[[bin]]
name = "pingap-waf"
path = "src/main.rs"

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
cfg-if = { workspace = true }
clap = { version = "4.6.4", features = [
    "derive",
    "std",
    "help",
    "usage",
], default-features = false }
ctor = { workspace = true }
crossbeam-channel = "0.5.16"
flate2 = { workspace = true }
glob = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
humantime = { workspace = true }
humantime-serde = { workspace = true }
nanoid = { workspace = true }
nix = { version = "0.31.3", features = ["signal"] }
pingap-acme = { workspace = true }
# Fork crate. The admin API's route table and its one access decision. Mounted into the
# existing admin plugin rather than served separately, so there is still one process.
pingap-admin-api = { workspace = true }
# Fork crate. The `plugin` feature is what registers `category = "acl"` with the
# plugin factory; without it this would be the rule table as a library and nothing
# would be wired into the request path.
pingap-acl = { workspace = true, features = ["plugin"] }
# Fork crate. The `plugin` feature registers `category = "bot"`.
pingap-bot = { workspace = true, features = ["plugin"] }
pingap-cache = { workspace = true }
pingap-certificate = { workspace = true }
pingap-config = { workspace = true }
# Fork crate. Users, sessions and the audit trail behind the admin plugin's
# per-user auth; the gateway boots and serves without it.
pingap-controlplane = { workspace = true }
pingap-core = { workspace = true }
pingap-imageoptim = { workspace = true, optional = true }
pingap-location = { workspace = true }
pingap-logger = { workspace = true }
pingap-otel = { workspace = true, optional = true }
pingap-performance = { workspace = true }
pingap-plugin = { workspace = true }
pingap-proxy = { workspace = true }
pingap-pyroscope = { workspace = true, optional = true }
pingap-sentry = { workspace = true, optional = true }
pingap-upstream = { workspace = true }
pingap-util = { workspace = true }
# Fork crate. The `plugin` feature is what registers `category = "waf"` with the
# plugin factory; without it this would be the engine as a library and nothing would
# be wired into the request path.
pingap-waf = { workspace = true, features = ["plugin"] }
pingap-webhook = { workspace = true }
pingora = { workspace = true }
regex = { workspace = true }
rust-embed = { version = "8.12.0", features = [
    "mime-guess",
    "compression",
], default-features = false }
serde_qs = { workspace = true }
sysinfo = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
substring = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
kdl = { workspace = true }

[build-dependencies]
vergen = { version = "9.1.0", features = ["build"] }
vergen-git2 = "9.1.0"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.47"

[features]
pyro = ["pingap-pyroscope"]
imageoptim = ["pingap-imageoptim"]
# Both crates that consult the embedded GeoIP database are enabled together. Enabling
# only one would give an operator `geo_restriction` but silently refuse every ACL
# `geo_country` rule, or the reverse.
geo = ["pingap-plugin/geo", "pingap-acl/geo"]
tracing = [
    "pingora/sentry",
    "pingap-cache/tracing",
    "pingap-core/tracing",
    "pingap-performance/tracing",
    "pingap-proxy/tracing",
    "pingap-otel",
    "pingap-sentry",
]
full = ["tracing", "imageoptim"]
perf = ["pyro", "full"]
default = []


[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
pretty_assertions = "1.4.1"
tokio-test = "0.4.4"
tempfile = { workspace = true }
# `test-support` exposes the code generator the 2FA login test needs.
pingap-controlplane = { workspace = true, features = ["test-support"] }


[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[profile.release-perf]
inherits = "release"
debug = 1
strip = "none"


[[bench]]
name = "bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["humantime-serde", "hcl-rs", "kdl"]

# Debian packaging (cargo-deb). The config path below is not a fresh choice: it
# is the one pingap-waf.service has always used, so the unit works as installed.
# `/etc/pingap` and `PINGAP_*` keep upstream's names on purpose — they are a
# runtime contract, and moving them would break every existing deployment for no
# gain. `usr/sbin` and `usr/share/doc` follow the package name, as Debian policy
# requires.
#
# Built from the musl targets in publish.yml, which link statically - hence
# `depends` is empty rather than `$auto`. `$auto` would run dpkg-shlibdeps and
# tie the package to the glibc of whichever runner built it.
[package.metadata.deb]
# The Cargo package is still `pingap` (see the note at the top of this file), so
# without this the .deb would be named for upstream while installing a binary and
# a unit called pingap-waf. cargo-deb is not run by this fork's CI — publish.yml
# is not vendored — but the metadata should still describe the artifact it would
# produce.
name = "pingap-waf"
maintainer = "Tree Xie <tree.xie@outlook.com>"
copyright = "2024-2026, Tree Xie <tree.xie@outlook.com>"
license-file = ["LICENSE", "0"]
extended-description = """\
pingap-waf is a fork of Pingap, the reverse proxy built on Cloudflare Pingora. \
It adds a native Rust WAF with CRS-category parity, a per-domain ACL, JA4H bot \
management, and a control plane with per-user admin auth, 2FA and config \
versioning. Configuration is TOML, HCL or KDL, hot-reloadable, and manageable \
from a built-in web admin panel; the WAF is attached per location as a plugin \
and defaults to detect-only."""
section = "net"
priority = "optional"
# Statically linked, so nothing to resolve at install time.
depends = ""
assets = [
    ["target/release/pingap-waf", "usr/sbin/pingap-waf", "755"],
    # The one config file that is canonical in every layout pingap supports, so
    # dropping it here cannot trigger the startup layout migration. Everything
    # in /etc is registered as a conffile, so an edited copy survives upgrades.
    ["conf/basic.toml", "etc/pingap/conf/basic.toml", "644"],
    ["README.md", "usr/share/doc/pingap-waf/README.md", "644"],
    # Reference material, deliberately outside /etc: these use the one file per
    # category layout, which would collide with the `?separation` layout the
    # unit asks for if they were loaded as live config.
    ["conf/servers.toml", "usr/share/doc/pingap-waf/examples/servers.toml", "644"],
    ["conf/locations.toml", "usr/share/doc/pingap-waf/examples/locations.toml", "644"],
    ["conf/upstreams.toml", "usr/share/doc/pingap-waf/examples/upstreams.toml", "644"],
    ["conf/plugins.toml", "usr/share/doc/pingap-waf/examples/plugins.toml", "644"],
    ["conf/certificates.toml", "usr/share/doc/pingap-waf/examples/certificates.toml", "644"],
]
# cargo-deb writes the generated systemd maintainer scripts here. Without this
# key it installs the unit but emits no postinst/postrm at all, so nothing runs
# `systemctl daemon-reload` and `purge` leaves the unit registered.
maintainer-scripts = "packaging/debian"

# `unit-scripts = "."` because pingap-waf.service lives at the repo root and is
# the file the docs point at. Installed but neither enabled nor started: the
# shipped config defines no server, so doing either here would only produce a
# failed unit. `systemctl enable --now pingap-waf` once there is something to
# serve.
[package.metadata.deb.systemd-units]
unit-name = "pingap-waf"
unit-scripts = "."
enable = false
start = false

[workspace]
members = [
    "pingap-acme",
    "pingap-cache",
    "pingap-certificate",
    "pingap-config",
    "pingap-core",
    "pingap-discovery",
    "pingap-health",
    "pingap-imageoptim",
    "pingap-location",
    "pingap-logger",
    "pingap-otel",
    "pingap-performance",
    "pingap-plugin",
    "pingap-proxy",
    "pingap-pyroscope",
    "pingap-sentry",
    "pingap-upstream",
    "pingap-util",
    "pingap-webhook",
    # Crates owned by this fork. The path prefix is the ownership marker: an
    # unprefixed member is vendored from upstream and carries merge debt, a
    # `crates/`-prefixed one is ours and carries none.
    "crates/pingap-acl",
    "crates/pingap-admin-api",
    "crates/pingap-bot",
    "crates/pingap-controlplane",
    "crates/pingap-waf",
]
# `spikes/` (phase 02) is deliberately absent from `members` and excluded here so
# throwaway spike dependencies can never reach the product build graph.
exclude = ["spikes"]
[workspace.package]
version = "0.13.10"

# Upstream declares `unwrap_used = "deny"` separately in each of its 19 crates
# and in the root package; there is no `[workspace.lints]` to inherit from. This
# table exists so the crates this fork owns opt in with `[lints] workspace = true`
# instead of repeating the policy five more times. Vendored crates are left
# alone — repointing them at this table would be diff for no behaviour change.
[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
aes-gcm-siv = { version = "0.11.1", default-features = false, features = [
    "aes",
    "alloc",
] }
ahash = "0.8.12"
arc-swap = "1.9.2"
async-trait = "0.1.91"
base64 = "0.23.0"
bytes = "1.12.1"
bytesize = { version = "2.4.2", features = ["serde"] }
bollard = "0.21.0"
bstr = "1.12.1"
dashmap = "6.2.1"
cfg-if = "1.0.4"
chrono = { version = "0.4.45", default-features = false, features = [
    "std",
    "clock",
] }
cookie = "0.18.1"
crc32fast = "1.5.0"
ctor = "1.0.11"
derive_more = { version = "2.1.1", default-features = false, features = [
    "debug",
] }
diff = "0.1.13"
dirs = "6.0.0"
etcd-client = "0.19.0"
fancy-regex = "0.18.0"
flate2 = "1.1.9"
futures = "0.3.33"
futures-util = "0.3.33"
glob = "0.3.4"
hex = "0.4.3"
hickory-resolver = "0.26.1"
http = "1.4.2"
hmac = "0.13.0"
hmac-sha256 = "1.1.14"
hmac-sha512 = { version = "1.1.12", default-features = false }
hostname = "0.4.2"
humantime = "2.4.0"
humantime-serde = "1.1.1"
instant-acme = "0.8.5"
ipnet = "2.12.0"
itoa = "1.0.18"
jsonwebtoken = "9.3.1"
local-ip-address = "0.6.13"
memory-stats = { version = "1.2.0", features = ["always_use_statm"] }
mime_guess = "2.0.5"
nanoid = "0.5.0"
num_cpus = "1.17.0"
opentelemetry = { version = "0.32.0", default-features = false, features = [
    "trace",
] }
opentelemetry-http = { version = "0.32.0", default-features = false }
opentelemetry-jaeger-propagator = { version = "0.32.0" }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
    "grpc-tonic",
    "trace",
] }
opentelemetry_sdk = { version = "0.32.1", features = [
    "rt-tokio",
], default-features = false }
path-absolutize = "4.0.1"
pingap-acme = { version = "0.13.10", path = "pingap-acme" }
pingap-cache = { version = "0.13.10", path = "pingap-cache" }
pingap-certificate = { version = "0.13.10", path = "pingap-certificate" }
pingap-config = { version = "0.13.10", path = "pingap-config" }
pingap-core = { version = "0.13.10", path = "pingap-core" }
pingap-discovery = { version = "0.13.10", path = "pingap-discovery" }
pingap-health = { version = "0.13.10", path = "pingap-health" }
pingap-imageoptim = { version = "0.13.10", path = "pingap-imageoptim" }
pingap-location = { version = "0.13.10", path = "pingap-location" }
pingap-logger = { version = "0.13.10", path = "pingap-logger" }
pingap-otel = { version = "0.13.10", path = "pingap-otel" }
pingap-performance = { version = "0.13.10", path = "pingap-performance" }
pingap-plugin = { version = "0.13.10", path = "pingap-plugin" }
pingap-proxy = { version = "0.13.10", path = "pingap-proxy" }
pingap-pyroscope = { version = "0.13.10", path = "pingap-pyroscope" }
pingap-sentry = { version = "0.13.10", path = "pingap-sentry" }
pingap-upstream = { version = "0.13.10", path = "pingap-upstream" }
pingap-util = { version = "0.13.10", path = "pingap-util" }
pingap-webhook = { version = "0.13.10", path = "pingap-webhook" }
# Crates owned by this fork. Declared path-only, with no `version`: they are
# `publish = false`, so a version requirement would buy nothing and would add
# five more lines to the two-place edit a version bump already needs.
pingap-acl = { path = "crates/pingap-acl" }
pingap-admin-api = { path = "crates/pingap-admin-api" }
pingap-bot = { path = "crates/pingap-bot" }
pingap-controlplane = { path = "crates/pingap-controlplane" }
pingap-waf = { path = "crates/pingap-waf" }
pingora = { version = "0.8.1", default-features = false, features = [
    "lb",
    "openssl",
    "cache",
] }
pingora-limits = "0.8.1"
pingora-runtime = "0.8.1"
pem = "3.0.6"
# Replaces tldextract, whose idna 0.2 dependency carries RUSTSEC-2024-0421;
# the public suffix list is compiled in, no runtime fetching.
psl = "2.1.223"
prometheus = { version = "0.14.0", default-features = false }
rand = "0.10.2"
rcgen = { version = "0.14.8", features = ["pem", "x509-parser"] }
regex = { version = "1.13.1", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = [
    "query",
    "json",
    "default-tls",
] }
rustls = "0.23.40"
rustls-pki-types = "1.15.1"
rustc_version_runtime = "0.3.0"
scopeguard = "1.2.0"
sentry-core = { version = "0.36.0", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
serde_qs = "1.1.2"
smallvec = "1.13.2"
snafu = { version = "0.9.2", features = ["std"], default-features = false }
sha1 = "0.11.0"
sha2 = { version = "0.11.0", default-features = false }
strum = { version = "0.28.0", features = ["derive"] }
substring = "1.4.5"
# 0.38.4 is the last version supporting rustc 1.88 (0.39.0 jumped to 1.95);
# do not bump past it without bumping the workspace MSRV.
sysinfo = { version = "0.38.4", features = [
    "system",
], default-features = false }
tempfile = "3.27.0"
time = { version = "0.3.54", features = ["local-offset"] }
TinyUFO = "0.8.1"
tokio = { version = "1.53.1", default-features = false, features = ["fs"] }
toml = "1.1.3"
hcl-rs = "0.19"
# 6.5.0 is the last version supporting rustc 1.88 (6.6.0 jumped to 1.95);
# do not bump past it without bumping the workspace MSRV.
kdl = "6.5.0"
tonic = "0.14.6"
tonic-health = "0.14.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
# `tracing-log` is one of the crate's default features, so it has to be listed
# back explicitly here. Without it the fmt layers render every record bridged
# from the `log` crate with the target `log`, hiding which dependency emitted it.
tracing-subscriber = { version = "0.3.23", features = [
    "local-time",
    "json",
    "fmt",
    "ansi",
    "env-filter",
    "tracing-log",
], default-features = false }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.24.0", features = [
    "v7",
    "std",
    "fast-rng",
], default-features = false }
walkdir = "2.5.0"
x509-parser = "0.18.1"
zstd = "0.13.3"
