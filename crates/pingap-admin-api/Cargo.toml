[package]
name = "pingap-admin-api"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
authors = ["keepmeside"]
keywords = ["pingap", "admin", "api"]
description = "Admin API routes for pingap"
# Not published: this crate exists only inside this workspace.
publish = false

[lib]
name = "pingap_admin_api"
path = "src/lib.rs"

[dependencies]
# The router speaks `http` types and raw bytes, not pingora ones. That is what lets the
# enumeration test drive every route without a listener, a socket or a live gateway.
http = { workspace = true }
bytes = { workspace = true }
# Roles, capabilities and the one authorisation decision. The router never re-implements
# the matrix; it names a capability per route and asks.
pingap-controlplane = { workspace = true }
pingap-core = { workspace = true }
# Config-shaped resources are stored as intent and projected, never written directly.
pingap-config = { workspace = true }
# The WAF's category table and its CRS lineage, for the read that tells a UI what a
# category is and which modes it accepts. Default features only, which is the engine
# without the pingora plugin: `categories` and `config` are pure Rust, so this adds no
# `*-sys` crate to the API's graph and no `#[ctor]` registration to the process.
pingap-waf = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
urlencoding = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `test-support` exposes the code generator, so a second-factor test can confirm an enrolment
# with a real code instead of asserting that every code is refused.
pingap-controlplane = { workspace = true, features = ["test-support"] }
pretty_assertions = "1.4.1"

[lints]
workspace = true
