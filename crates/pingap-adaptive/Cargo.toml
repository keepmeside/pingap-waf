[package]
name = "pingap-adaptive"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "pingap_adaptive"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
ctor = { workspace = true }
humantime-serde = { workspace = true }
pingap-config = { workspace = true }
pingap-core = { workspace = true }
pingap-domainstate = { workspace = true }
pingap-plugin = { workspace = true }
pingora = { workspace = true }
serde = { workspace = true, features = ["derive"] }
snafu = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Renders `{:name}` against a `Parser` so the access-log variables are asserted on the
# bytes a log format emits, not on the variables map. Dev-only, not in the shipped
# binary.
pingap-logger = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-test = "0.4.4"

# `harness = false` with no framework: like the detector latency bench, this times
# single calls and reads percentiles off the sorted samples, because the decision
# the measurement owes (does recording stay per-request?) reads p99, and a batch
# mean is not a p99.
[[bench]]
name = "sampling"
harness = false

[lints]
workspace = true

# `humantime-serde` is used only inside `#[serde(with = …)]` attributes, which
# cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["humantime-serde"]
