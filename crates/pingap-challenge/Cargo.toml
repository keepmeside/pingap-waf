[package]
name = "pingap-challenge"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
authors = ["keepmeside"]
description = "Self-contained challenge tier for pingap"
publish = false

[lib]
name = "pingap_challenge"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
pingap-behaviour = { workspace = true }
pingap-adaptive = { workspace = true }
ctor = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
humantime-serde = { workspace = true }
http = { workspace = true }
pingap-acl = { workspace = true }
pingap-config = { workspace = true }
pingap-core = { workspace = true }
pingap-domainstate = { workspace = true }
pingap-plugin = { workspace = true }
pingap-util = { workspace = true }
pingora = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
snafu = { workspace = true }
toml = { workspace = true }
urlencoding = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Renders `{:name}` against a `Parser` so the access-log variables are asserted on the
# bytes a log format emits, not on the variables map — the assertion that catches a
# variable that was set but never reached a line. Dev-only, not in the shipped binary.
pingap-logger = { workspace = true }
# Captures the plugin's `debug` decision lines so the recorded verdict is
# asserted on emitted bytes — the same argument as `pingap-logger` above, for
# the log lines instead of the log variables.
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tokio-test = "0.4.4"

[lints]
workspace = true

# `humantime-serde` is used only inside `#[serde(with = …)]` attributes, which
# cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["humantime-serde"]
